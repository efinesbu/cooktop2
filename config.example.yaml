tiktok:
  client_key: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  client_secret: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  access_token: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  refresh_token: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"

tiktok-sandbox:
  client_key: "YOUR_TIKTOK_SANDBOX_CLIENT_KEY"
  client_secret: "YOUR_TIKTOK_SANDBOX_CLIENT_SECRET"
  # Must exactly match a Login Kit redirect URI configured in TikTok Developer Portal.
  # Local testing: http://localhost:8000/callback
  # Review/demo via Cloudflare Tunnel: https://demo.veluraesthetics.com/callback
  redirect_uri: "https://demo.veluraesthetics.com/callback"

x:
  api_key: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  api_secret: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  access_token: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  access_token_secret: "XXXXXXXXXXXXXXXXXXXXXXXXXXXX"

make_bridge:
  webhook_url: "https://hook.us2.make.com/your-webhook-id"
  r2:
    account_id: "YOUR_CLOUDFLARE_R2_ACCOUNT_ID"
    access_key_id: "YOUR_CLOUDFLARE_R2_ACCESS_KEY_ID"
    secret_access_key: "YOUR_CLOUDFLARE_R2_SECRET_ACCESS_KEY"
    bucket_name: "your-r2-bucket-name"

instagram_sync:
  spreadsheet_id: "1xqShI6fSYiIlYIlJI-nE9GvuNPH6qM-1F4h_vEfjrf4"
  worksheet_gid: "0"
  # Optional for non-public sheets:
  # worksheet_name: "Sheet1"
  # credentials_file: "google_sheets_service_account.json"
  # Optional override if you want to paste the full published CSV URL:
  # public_csv_url: "https://docs.google.com/spreadsheets/d/.../export?format=csv&gid=0"

gcs:
  bucket_name: "velura-video-archive"
  credentials_file: "gcs_service_account.json"

briefing:
  email: ""
  slack_webhook: ""
  smtp_host: "smtp.example.com"
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""
  from_email: "velura@example.com"
  smtp_tls: true

posting:
  stagger_minutes:
    tiktok: 0
    instagram: 120
    youtube: 360
    x: 480

text_review:
  min_posts: 5
  lookback_days: 30

data_root: "~/.velura"

# image_motion_15s: reference folders for Gemini-generated frames
# - brand/: brand-kit images (always attached)
# - models/: human-model images (for lifestyle frames only)
# Paths: {data_root}/brand/, {data_root}/models/

# Optional: override ffmpeg path (for image_motion_15s). Default: auto-detect from PATH.
# ffmpeg:
#   path: "C:/ffmpeg/bin/ffmpeg.exe"

daily_budget_usd: 50.0

# Shared bandit: used by run --auto and run --product SLUG (when no --theme/--hook)
bandit:
  daily_slots: 8
  min_top_k: 3
  allocation_ceiling: 0.7
  expand_after_creatives: 40
  # Phase 6: ranking objective for organic evaluation and bandit updates
  # engagement_rate (default), views, composite, revenue, sessions, purchases
  ranking_objective: engagement_rate
  starter_arms:
    - "stakes_cost_of_inaction__relatable_pain"
    - "problem_solution__relatable_pain"
    - "hidden_knowledge__question"
    - "identity_tribe__bold_claim"
