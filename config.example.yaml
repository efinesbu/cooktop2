# Velura config – non-secret settings. For API keys and tokens, prefer .env:
#   cp .env.example .env
#   # Edit .env with real values (never commit .env)
# Env vars override config.yaml for keys listed in .env.example.

site_url: "https://veluraesthetics.com"

platforms:
  enabled:
    - youtube

shopify:
  store_url: ""
  client_id: ""
  client_secret: ""

