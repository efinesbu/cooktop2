[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cooktop-monitor"
version = "0.1.0"
description = "Photo-based KitchenAid radiant cooktouch control panel state detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pillow-heif>=0.13",
    "pydantic>=2.0",
    "pytesseract>=0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
